<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audit Total KO-BRAS</title>
<link rel="stylesheet" href="style.css">
<style>
  body{padding:1.25rem; font-family:system-ui, sans-serif; max-width:720px; margin:0 auto;}
  h1{font-size:1.4rem; margin-bottom:.25rem}
  h2{font-size:1rem; margin:1.5rem 0 .5rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); border-bottom:1px solid var(--border); padding-bottom:.25rem}
  .item{padding:.65rem .85rem; margin:.35rem 0; border-radius:8px; border:1px solid var(--border); background:var(--surface); font-size:.85rem}
  .ok{border-left:3px solid var(--ok); background:#ecfdf5}
  .bad{border-left:3px solid var(--err); background:#fef2f2}
  .warn{border-left:3px solid var(--brand); background:#eff6ff}
  pre{font-size:.7rem; white-space:pre-wrap; word-break:break-all; margin:.35rem 0 0; color:var(--muted)}
  button{margin-top:1rem; padding:.75rem 1rem; border-radius:10px; border:1px solid var(--border); background:var(--brand); color:white; font-weight:700; width:100%; font-size:1rem; cursor:pointer}
  .summary{padding:1rem; background:var(--brand-light); border-radius:12px; margin-bottom:1rem; font-weight:700; display:none}
</style>
</head>
<body>
<h1>Audit Total KO-BRAS</h1>
<p class="muted small">Cek struktur database, RLS, RPC, Enum, dan alur kritis.</p>
<div id="summary" class="summary"></div>
<div id="out"></div>
<button onclick="location.reload()">Ulangi Audit</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
const out = document.getElementById('out');
let pass = 0, fail = 0, warn = 0;
const failList = [];

function add(cls, title, detail) {
  const d = document.createElement('div');
  d.className = 'item ' + cls;
  d.innerHTML = '<b>' + title + '</b>' + (detail ? '<pre>' + String(detail).replace(/</g,'&lt;') + '</pre>' : '');
  out.appendChild(d);
  if (cls === 'ok') pass++;
  else if (cls === 'bad') { fail++; failList.push(title); }
  else if (cls === 'warn') warn++;
  
  const sum = document.getElementById('summary');
  sum.style.display = 'block';
  sum.innerHTML = `Hasil: <span style="color:var(--ok)">${pass} OK</span> · <span style="color:var(--err)">${fail} GAGAL</span> · <span style="color:var(--brand)">${warn} WARN</span>`;
}

function section(title) {
  const h = document.createElement('h2');
  h.textContent = title;
  out.appendChild(h);
}

(async () => {
  if (!window.KB || !window.KB.supabase) { add('bad', '✗ auth.js gagal load', ''); return; }
  const sb = window.KB.supabase;

  const { data: { session } } = await sb.auth.getSession();
  if (!session) { add('bad', '✗ Tidak ada session', 'Login dulu sebelum buka halaman ini.'); return; }

  const { data: org } = await sb.from('organizations').select('id, type, name').eq('created_by', session.user.id).maybeSingle();
  if (!org) { add('bad', '✗ Organisasi tidak ditemukan', ''); return; }

  add('ok', 'Setup', `Login: ${session.user.email}\nOrg: ${org.name} (${org.type})`);

  // ============================================
  section('1. TABEL & KOLOM');
  // ============================================
  
  const tables = [
    { name: 'profiles', cols: 'id, full_name, phone' },
    { name: 'organizations', cols: 'id, name, type, city, province, status' },
    { name: 'organization_members', cols: 'org_id, profile_id, role' },
    { name: 'work_orders', cols: 'id, org_id, title, description, address, pic_name, pic_phone, total_price, status' },
    { name: 'work_order_items', cols: 'work_order_id, name' },
    { name: 'work_order_applications', cols: 'work_order_id, org_id, status, message' },
    { name: 'partner_surveys', cols: 'garment_org_id, konveksi_org_id, surveyed_by' },
    { name: 'organization_verifications', cols: 'id, org_id, status' },
    { name: 'organization_verification_events', cols: 'id, verification_id, event_type' },
    { name: 'platform_admins', cols: 'profile_id' }
  ];

  for (const t of tables) {
    const { error } = await sb.from(t.name).select(t.cols).limit(1);
    if (error) add('bad', `✗ Tabel/Kolom ${t.name}`, error.message);
    else add('ok', `✓ ${t.name}`, `${t.cols}`);
  }

  // ============================================
  section('2. FUNGSI DATABASE (RPC)');
  // ============================================
  
  const rpcs = [
    { name: 'get_orgs_public', args: { p_ids: [org.id] }, expect: 'success' },
    { name: 'accept_application_with_survey', args: { p_app_id: '00000000-0000-0000-0000-000000000000', p_survey_date: '2026-01-01', p_survey_notes: 'test' }, expect: 'Lamaran tidak ditemukan' },
    { name: 'is_konveksi_winner', args: { p_work_order_id: '00000000-0000-0000-0000-000000000000' }, expect: 'success' },
    { name: 'update_my_profile', args: {}, expect: 'success' }
  ];

  for (const r of rpcs) {
    const { error } = await sb.rpc(r.name, r.args);
    if (!error) {
      add('ok', `✓ RPC ${r.name}`, 'Exist (no error)');
    } else if (error.message.includes(r.expect) || error.code === '42883' === false) {
      if (error.code === '42883') add('bad', `✗ RPC ${r.name} TIDAK ADA`, error.message);
      else add('ok', `✓ RPC ${r.name}`, `Exist (return: ${error.message})`);
    } else {
      add('bad', `✗ RPC ${r.name} ERROR`, error.message);
    }
  }

  // ============================================
  section('3. ENUM STATUS (5 VALUE)');
  // ============================================
  
  const statuses = ['open', 'matched', 'in_progress', 'completed', 'cancelled'];
  for (const st of statuses) {
    const { error } = await sb.from('work_orders').select('id').eq('status', st).limit(1);
    if (error) add('bad', `✗ Status "${st}" tidak valid`, error.message);
    else add('ok', `✓ Status "${st}" ada`, '');
  }

  // ============================================
  section('4. RLS / KEAMANAN');
  // ============================================
  
  // 4a. Bisa baca profile sendiri
  const { error: pErr } = await sb.from('profiles').select('id, full_name').eq('id', session.user.id).maybeSingle();
  if (pErr) add('bad', '✗ Baca profile sendiri', pErr.message);
  else add('ok', '✓ Baca profile sendiri', '');

  // 4b. Gak bisa baca phone lewat SELECT *
  const { error: phoneErr } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if (phoneErr) add('ok', '✓ Kolom phone terlindungi', 'SELECT * ditolak (bagus)');
  else add('warn', '⚠ SELECT * di profiles diizinin', 'Cek column grant');

  // 4c. Bisa baca work_orders sendiri
  const { error: woErr } = await sb.from('work_orders').select('id').limit(1);
  if (woErr) add('bad', '✗ Baca work_orders', woErr.message);
  else add('ok', '✓ Baca work_orders', '');

  // 4d. Bisa baca work_order_applications
  const { error: appErr } = await sb.from('work_order_applications').select('id').limit(1);
  if (appErr) add('bad', '✗ Baca work_order_applications', appErr.message);
  else add('ok', '✓ Baca work_order_applications', '');

  // 4e. Cek RLS aktif di tabel utama
  // Kita ngetes dengan query yang seharusnya error kalau RLS gak aktif
  const { error: rlsCheck } = await sb.from('platform_admins').select('*').limit(1);
  if (rlsCheck && (rlsCheck.message.includes('permission') || rlsCheck.message.includes('policy'))) {
    add('ok', '✓ RLS di platform_admins aktif', 'Akses ditolak (bagus)');
  } else if (!rlsCheck) {
    add('bad', '✗ RLS di platform_admins TIDAK AKTIF', 'Siapapun bisa baca admin!');
  }

  // ============================================
  section('5. UJI SIMULASI (INSERT & DELETE)');
  // ============================================
  
  // Buat WO uji
  const { data: testWo, error: insErr } = await sb.from('work_orders').insert({
    org_id: org.id,
    created_by: session.user.id,
    title: `TEST_AUDIT_${Date.now()}`,
    target_quantity: 1,
    total_price: 1000,
    description: 'test desc',
    address: 'test addr',
    pic_name: 'test pic',
    pic_phone: '0812',
    status: 'open'
  }).select().single();

  if (insErr) {
    add('bad', '✗ INSERT work_orders', insErr.message);
  } else {
    add('ok', '✓ INSERT work_orders berhasil', `ID: ${testWo.id.slice(0, 8)}...`);

    // Coba update status ke matched
    const { error: upErr } = await sb.from('work_orders').update({ status: 'matched' }).eq('id', testWo.id);
    if (upErr) add('bad', '✗ Update status ke "matched"', upErr.message);
    else add('ok', '✓ Update status ke "matched"', '');

    // Hapus data uji
    const { error: delErr } = await sb.from('work_orders').delete().eq('id', testWo.id);
    if (delErr) add('warn', '⚠ Hapus WO uji gagal', delErr.message);
    else add('ok', '✓ Hapus WO uji', '');
  }

  // ============================================
  section('6. SIMULASI ALUR SURAT JALAN (E2E)');
  // ============================================
  
  const testMarker = `AUDIT_SJ_${Date.now()}`;
  let createdWoId = null;
  let createdAppId = null;

  if (org.type === 'garment') {
    // ======== SEBAGAI GARMENT ========
    add('ok', 'Mode: GARMENT', 'Kita bakal bikin SJ, cek status open, lalu hapus.');

    // 6a. Bikin SJ
    const { data: wo, error: insErr } = await sb.from('work_orders').insert({
      org_id: org.id,
      created_by: session.user.id,
      title: testMarker,
      description: 'Test deskripsi E2E',
      target_quantity: 1000,
      total_price: 4000000,
      deadline: '2026-12-31',
      address: 'Jl. Test No. 1',
      pic_name: 'Budi Test',
      pic_phone: '08123456789',
      negotiable_note: 'Nego tipis oke',
      status: 'open'
    }).select().single();

    if (insErr) {
      add('bad', '✗ Bikin SJ gagal', insErr.message);
    } else {
      createdWoId = wo.id;
      add('ok', '✓ SJ dibikin', `ID: ${wo.id.slice(0, 8)}...
Status: ${wo.status}
Target: ${wo.target_quantity} pcs
Harga: Rp ${wo.total_price.toLocaleString('id-ID')}`);

      // 6b. Cek semua kolom baru ada isinya
      const fields = ['description', 'address', 'pic_name', 'pic_phone', 'total_price'];
      let allFilled = true;
      for (const f of fields) {
        if (!wo[f]) { allFilled = false; add('bad', `✗ Kolom "${f}" kosong`, ''); }
      }
      if (allFilled) add('ok', '✓ Semua kolom terisi', fields.join(', '));

      // 6c. Bikin item bahan
      const { error: itemErr } = await sb.from('work_order_items').insert({
        work_order_id: wo.id, name: 'Cotton Combed 30s'
      });
      if (itemErr) add('bad', '✗ Insert item bahan', itemErr.message);
      else add('ok', '✓ Item bahan ditambah', 'Cotton Combed 30s');

      // 6d. Cek SJ muncul di list open
      const { data: openList } = await sb.from('work_orders').select('id').eq('status', 'open').eq('id', wo.id);
      if (openList && openList.length > 0) add('ok', '✓ SJ muncul di list open', '');
      else add('bad', '✗ SJ gak muncul di list open', 'RLS issue?');

      // 6e. Cek status "matched" bisa di-set (simulasi "Terima")
      const { error: matchedErr } = await sb.from('work_orders').update({ status: 'matched' }).eq('id', wo.id);
      if (matchedErr) add('bad', '✗ Update ke "matched"', matchedErr.message);
      else add('ok', '✓ Update status ke "matched"', 'Simulasi terima Konveksi berhasil');

      // 6f. Cek "in_progress" bisa di-set
      const { error: progErr } = await sb.from('work_orders').update({ status: 'in_progress' }).eq('id', wo.id);
      if (progErr) add('bad', '✗ Update ke "in_progress"', progErr.message);
      else add('ok', '✓ Update status ke "in_progress"', '');

      // 6g. Cek "completed" bisa di-set
      const { error: compErr } = await sb.from('work_orders').update({ status: 'completed' }).eq('id', wo.id);
      if (compErr) add('bad', '✗ Update ke "completed"', compErr.message);
      else add('ok', '✓ Update status ke "completed"', 'Siklus lengkap ok');

      // 6h. Simulasi tanpa lamaran (harus error)
      const { error: acceptErr } = await sb.rpc('accept_application_with_survey', {
        p_app_id: '00000000-0000-0000-0000-000000000000',
        p_survey_date: '2026-01-01'
      });
      if (acceptErr && acceptErr.message.includes('tidak ditemukan')) {
        add('ok', '✓ RPC nolak UUID dummy', 'Bagus, validasi jalan');
      } else {
        add('warn', '⚠ RPC gak nolak UUID dummy', 'Cek validasi RPC');
      }

    }
  } else if (org.type === 'konveksi') {
    // ======== SEBAGAI KONVEKSI ========
    add('ok', 'Mode: KONVEKSI', 'Kita bakal cari SJ open, lamar, lalu cek status.');

    // 6a. Cari SJ open
    const { data: openWos, error: openErr } = await sb.from('work_orders').select('id, title').eq('status', 'open').limit(1);
    if (openErr) {
      add('bad', '✗ Query SJ open', openErr.message);
    } else if (!openWos || openWos.length === 0) {
      add('warn', '⚠ Gak ada SJ open', 'Login sebagai Garment dulu, bikin SJ, baru balik ke sini');
    } else {
      add('ok', '✓ Ketemu SJ open', `Judul: ${openWos[0].title}`);
      createdWoId = openWos[0].id;

      // 6b. Cek apakah udah pernah lamar
      const { data: existing } = await sb.from('work_order_applications')
        .select('id').eq('work_order_id', createdWoId).eq('org_id', org.id).maybeSingle();

      if (existing) {
        add('warn', '⚠ Sudah pernah lamar SJ ini', 'Skip test lamar');
        createdAppId = existing.id;
      } else {
        // 6c. Kirim lamaran (komentar)
        const { data: app, error: appErr } = await sb.from('work_order_applications').insert({
          work_order_id: createdWoId,
          org_id: org.id,
          message: 'AUDIT: Sanggup bos'
        }).select().single();

        if (appErr) {
          add('bad', '✗ Kirim lamaran gagal', appErr.message);
        } else {
          createdAppId = app.id;
          add('ok', '✓ Lamaran terkirim', `Status: ${app.status}
Message: ${app.message.slice(0, 20)}...`);

          // 6d. Cek status pending
          if (app.status === 'pending') add('ok', '✓ Status lamaran = pending', 'Sesuai ekspektasi');
          else add('bad', '✗ Status lamaran bukan pending', `Dapat: ${app.status}`);

          // 6e. Cek gak bisa lamar 2x
          const { error: dupErr } = await sb.from('work_order_applications').insert({
            work_order_id: createdWoId, org_id: org.id, message: 'dup'
          });
          if (dupErr) add('ok', '✓ Gak bisa lamar 2x', 'Constraint unique jalan');
          else add('bad', '✗ Bisa lamar 2x', 'Constraint unique gak jalan!');
        }
      }

      // 6f. Cek konveksi bisa lihat SJ yang dia lamar (via policy baru)
      const { data: myApps } = await sb.from('work_order_applications')
        .select('work_order_id, status, work_orders(id, title, status)')
        .eq('org_id', org.id).eq('status', 'accepted').limit(1);
      
      if (myApps && myApps.length > 0) {
        add('ok', '✓ Lihat SJ yang dimenangkan', `Judul: ${myApps[0].work_orders?.title}`);
      } else {
        add('warn', '⚠ Belum ada SJ yang dimenangkan', 'Butuh Garment untuk terima lamaran dulu');
      }
    }
  } else {
    add('warn', '⚠ Role tidak dikenal', `org.type: ${org.type}`);
  }

  // ======== CLEANUP (hapus data uji) ========
  if (createdAppId) {
    await sb.from('work_order_applications').delete().eq('id', createdAppId);
    add('ok', '✓ Cleanup lamaran uji', '');
  }
  if (createdWoId && org.type === 'garment') {
    await sb.from('work_order_items').delete().eq('work_order_id', createdWoId);
    await sb.from('work_order_applications').delete().eq('work_order_id', createdWoId);
    await sb.from('work_orders').delete().eq('id', createdWoId);
    add('ok', '✓ Cleanup SJ uji', '');
  }

  // ============================================
  section('7. UJI "TERBITKAN SURAT JALAN" (UI)');
  // ============================================

  if (org.type === 'garment') {
    // Simulasi persis seperti tombol "Terbitkan" di dashboard
    const uiTestTitle = `UI_TERBIT_TEST_${Date.now()}`;
    const { data: newWo, error: uiInsErr } = await sb.from('work_orders').insert({
      org_id: org.id,
      created_by: session.user.id,
      title: uiTestTitle,
      description: 'Test dari cek.html Section 7',
      target_quantity: 500,
      total_price: 2000000,
      deadline: '2026-12-31',
      address: 'Jl. UI Test No. 1',
      pic_name: 'UI Tester',
      pic_phone: '08111111111',
      negotiable_note: 'nego',
      status: 'open'
    }).select().single();

    if (uiInsErr) {
      add('bad', '✗ Terbitkan Surat Jalan gagal', `${uiInsErr.message}\n\nCode: ${uiInsErr.code}`);
    } else {
      add('ok', '✓ Surat Jalan diterbitkan', `ID: ${newWo.id.slice(0, 8)}...\nTitle: ${newWo.title}`);

      // Test 1: Muncul di query list Garment (seperti loadGarment di dashboard)
      const { data: garmentList, error: garmentListErr } = await sb.from('work_orders')
        .select('id, title, status, target_quantity, total_price, created_at')
        .eq('org_id', org.id)
        .order('created_at', { ascending: false });

      if (garmentListErr) {
        add('bad', '✗ Query list Garment gagal', garmentListErr.message);
      } else {
        const found = (garmentList || []).find(w => w.id === newWo.id);
        if (found) {
          add('ok', '✓ Muncul di list Garment', `Total: ${garmentList.length} SJ di list\nPosisi: ${garmentList.findIndex(w => w.id === newWo.id) + 1} dari ${garmentList.length}`);
        } else {
          add('bad', '✗ GAK muncul di list Garment', `Query berhasil (${garmentList.length} baris) tapi SJ baru gak ada.\n\nCek RLS atau filter.`);
        }
      }

      // Test 2: Muncul di query tab "Surat Jalan Aktif" (filter status open)
      const { data: openList } = await sb.from('work_orders')
        .select('id, title').eq('org_id', org.id).eq('status', 'open');
      
      const foundInOpen = (openList || []).find(w => w.id === newWo.id);
      if (foundInOpen) {
        add('ok', '✓ Muncul di "Surat Jalan Aktif"', `Total open: ${openList.length}`);
      } else {
        add('bad', '✗ GAK muncul di "Surat Jalan Aktif"', `Total open: ${openList?.length || 0}\n\nFilter status atau RLS issue.`);
      }

      // Test 3: Cek apakah Konveksi bisa lihat (simulasi)
      const { data: publicList } = await sb.from('work_orders')
        .select('id, title, status').eq('status', 'open').eq('id', newWo.id);
      
      if (publicList && publicList.length > 0) {
        add('ok', '✓ Bisa dilihat publik (status open)', 'Konveksi bisa lihat via RLS policy wo_konveksi');
      } else {
        add('warn', '⚠ Gak muncul di query publik', 'RLS policy wo_konveksi mungkin blok');
      }

      // Test 4: Cek item bahan beneran masuk
      const { data: itemData, error: itemErr } = await sb.from('work_order_items')
        .select('name').eq('work_order_id', newWo.id);
      
      if (itemErr) add('bad', '✗ Cek item bahan', itemErr.message);
      else if (itemData && itemData.length > 0) add('ok', '✓ Item bahan tersimpan', itemData.map(i => i.name).join(', '));
      else add('bad', '✗ Item bahan KOSONG', 'Insert item gak jalan?');

      // ============================================
      // CLEANUP
      // ============================================
      await sb.from('work_order_items').delete().eq('work_order_id', newWo.id);
      await sb.from('work_orders').delete().eq('id', newWo.id);
      add('ok', '✓ Cleanup data test', '');
    }
  } else {
    add('warn', '⚠ Bukan Garment', `Mode: ${org.type}. Section 7 hanya jalan untuk Garment.`);
  }

  // ============================================
  // KESIMPULAN
  // ============================================
  section('KESIMPULAN');
  if (fail === 0) {
    add('ok', '🎉 SEMUA TES LULUS!', `${pass} OK · ${warn} WARN · 0 GAGAL\n\nAplikasi siap dipakai.`);
  } else {
    add('bad', `⚠️ ${fail} GAGAL`, `Tes gagal:\n${failList.map(f => '• ' + f).join('\n')}`);
  }
})();
</script>
</body>
</html>
