<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audit Total KO-BRAS</title>
<link rel="stylesheet" href="style.css">
<style>
  body{padding:1.25rem; font-family:system-ui, sans-serif; max-width:720px; margin:0 auto;}
  h1{font-size:1.4rem; margin-bottom:.25rem}
  h2{font-size:1rem; margin:1.5rem 0 .5rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); border-bottom:1px solid var(--border); padding-bottom:.25rem}
  .item{padding:.65rem .85rem; margin:.35rem 0; border-radius:8px; border:1px solid var(--border); background:var(--surface); font-size:.85rem}
  .ok{border-left:3px solid var(--ok); background:#ecfdf5}
  .bad{border-left:3px solid var(--err); background:#fef2f2}
  .warn{border-left:3px solid var(--brand); background:#eff6ff}
  pre{font-size:.7rem; white-space:pre-wrap; word-break:break-all; margin:.35rem 0 0; color:var(--muted)}
  button{margin-top:1rem; padding:.75rem 1rem; border-radius:10px; border:1px solid var(--border); background:var(--brand); color:white; font-weight:700; width:100%; font-size:1rem; cursor:pointer}
  .summary{padding:1rem; background:var(--brand-light); border-radius:12px; margin-bottom:1rem; font-weight:700; display:none}
</style>
</head>
<body>
<h1>Audit Total KO-BRAS</h1>
<p class="muted small">Cek struktur database, RLS, RPC, Enum, dan alur kritis.</p>
<div id="summary" class="summary"></div>
<div id="out"></div>
<button onclick="location.reload()">Ulangi Audit</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
const out = document.getElementById('out');
let pass = 0, fail = 0, warn = 0;
const failList = [];

function add(cls, title, detail) {
  const d = document.createElement('div');
  d.className = 'item ' + cls;
  d.innerHTML = '<b>' + title + '</b>' + (detail ? '<pre>' + String(detail).replace(/</g,'&lt;') + '</pre>' : '');
  out.appendChild(d);
  if (cls === 'ok') pass++;
  else if (cls === 'bad') { fail++; failList.push(title); }
  else if (cls === 'warn') warn++;
  
  const sum = document.getElementById('summary');
  sum.style.display = 'block';
  sum.innerHTML = `Hasil: <span style="color:var(--ok)">${pass} OK</span> · <span style="color:var(--err)">${fail} GAGAL</span> · <span style="color:var(--brand)">${warn} WARN</span>`;
}

function section(title) {
  const h = document.createElement('h2');
  h.textContent = title;
  out.appendChild(h);
}

(async () => {
  if (!window.KB || !window.KB.supabase) { add('bad', '✗ auth.js gagal load', ''); return; }
  const sb = window.KB.supabase;

  const { data: { session } } = await sb.auth.getSession();
  if (!session) { add('bad', '✗ Tidak ada session', 'Login dulu sebelum buka halaman ini.'); return; }

  const { data: org } = await sb.from('organizations').select('id, type, name').eq('created_by', session.user.id).maybeSingle();
  if (!org) { add('bad', '✗ Organisasi tidak ditemukan', ''); return; }

  add('ok', 'Setup', `Login: ${session.user.email}\nOrg: ${org.name} (${org.type})`);

  // ============================================
  section('1. TABEL & KOLOM');
  // ============================================
  
  const tables = [
    { name: 'profiles', cols: 'id, full_name, phone' },
    { name: 'organizations', cols: 'id, name, type, city, province, status' },
    { name: 'organization_members', cols: 'org_id, profile_id, role' },
    { name: 'work_orders', cols: 'id, org_id, title, description, address, pic_name, pic_phone, total_price, status' },
    { name: 'work_order_items', cols: 'work_order_id, name' },
    { name: 'work_order_applications', cols: 'work_order_id, org_id, status, message' },
    { name: 'partner_surveys', cols: 'garment_org_id, konveksi_org_id, surveyed_by' },
    { name: 'organization_verifications', cols: 'id, org_id, status' },
    { name: 'organization_verification_events', cols: 'id, verification_id, event_type' },
    { name: 'platform_admins', cols: 'profile_id' }
  ];

  for (const t of tables) {
    const { error } = await sb.from(t.name).select(t.cols).limit(1);
    if (error) add('bad', `✗ Tabel/Kolom ${t.name}`, error.message);
    else add('ok', `✓ ${t.name}`, `${t.cols}`);
  }

  // ============================================
  section('2. FUNGSI DATABASE (RPC)');
  // ============================================
  
  const rpcs = [
    { name: 'get_orgs_public', args: { p_ids: [org.id] }, expect: 'success' },
    { name: 'accept_application_with_survey', args: { p_app_id: '00000000-0000-0000-0000-000000000000', p_survey_date: '2026-01-01', p_survey_notes: 'test' }, expect: 'Lamaran tidak ditemukan' },
    { name: 'is_konveksi_winner', args: { p_work_order_id: '00000000-0000-0000-0000-000000000000' }, expect: 'success' },
    { name: 'update_my_profile', args: {}, expect: 'success' }
  ];

  for (const r of rpcs) {
    const { error } = await sb.rpc(r.name, r.args);
    if (!error) {
      add('ok', `✓ RPC ${r.name}`, 'Exist (no error)');
    } else if (error.message.includes(r.expect) || error.code === '42883' === false) {
      if (error.code === '42883') add('bad', `✗ RPC ${r.name} TIDAK ADA`, error.message);
      else add('ok', `✓ RPC ${r.name}`, `Exist (return: ${error.message})`);
    } else {
      add('bad', `✗ RPC ${r.name} ERROR`, error.message);
    }
  }

  // ============================================
  section('3. ENUM STATUS (5 VALUE)');
  // ============================================
  
  const statuses = ['open', 'matched', 'in_progress', 'completed', 'cancelled'];
  for (const st of statuses) {
    const { error } = await sb.from('work_orders').select('id').eq('status', st).limit(1);
    if (error) add('bad', `✗ Status "${st}" tidak valid`, error.message);
    else add('ok', `✓ Status "${st}" ada`, '');
  }

  // ============================================
  section('4. RLS / KEAMANAN');
  // ============================================
  
  // 4a. Bisa baca profile sendiri
  const { error: pErr } = await sb.from('profiles').select('id, full_name').eq('id', session.user.id).maybeSingle();
  if (pErr) add('bad', '✗ Baca profile sendiri', pErr.message);
  else add('ok', '✓ Baca profile sendiri', '');

  // 4b. Gak bisa baca phone lewat SELECT *
  const { error: phoneErr } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if (phoneErr) add('ok', '✓ Kolom phone terlindungi', 'SELECT * ditolak (bagus)');
  else add('warn', '⚠ SELECT * di profiles diizinin', 'Cek column grant');

  // 4c. Bisa baca work_orders sendiri
  const { error: woErr } = await sb.from('work_orders').select('id').limit(1);
  if (woErr) add('bad', '✗ Baca work_orders', woErr.message);
  else add('ok', '✓ Baca work_orders', '');

  // 4d. Bisa baca work_order_applications
  const { error: appErr } = await sb.from('work_order_applications').select('id').limit(1);
  if (appErr) add('bad', '✗ Baca work_order_applications', appErr.message);
  else add('ok', '✓ Baca work_order_applications', '');

  // 4e. Cek RLS aktif di tabel utama
  // Kita ngetes dengan query yang seharusnya error kalau RLS gak aktif
  const { error: rlsCheck } = await sb.from('platform_admins').select('*').limit(1);
  if (rlsCheck && (rlsCheck.message.includes('permission') || rlsCheck.message.includes('policy'))) {
    add('ok', '✓ RLS di platform_admins aktif', 'Akses ditolak (bagus)');
  } else if (!rlsCheck) {
    add('bad', '✗ RLS di platform_admins TIDAK AKTIF', 'Siapapun bisa baca admin!');
  }

  // ============================================
  section('5. UJI SIMULASI (INSERT & DELETE)');
  // ============================================
  
  // Buat WO uji
  const { data: testWo, error: insErr } = await sb.from('work_orders').insert({
    org_id: org.id,
    created_by: session.user.id,
    title: `TEST_AUDIT_${Date.now()}`,
    target_quantity: 1,
    total_price: 1000,
    description: 'test desc',
    address: 'test addr',
    pic_name: 'test pic',
    pic_phone: '0812',
    status: 'open'
  }).select().single();

  if (insErr) {
    add('bad', '✗ INSERT work_orders', insErr.message);
  } else {
    add('ok', '✓ INSERT work_orders berhasil', `ID: ${testWo.id.slice(0, 8)}...`);

    // Coba update status ke matched
    const { error: upErr } = await sb.from('work_orders').update({ status: 'matched' }).eq('id', testWo.id);
    if (upErr) add('bad', '✗ Update status ke "matched"', upErr.message);
    else add('ok', '✓ Update status ke "matched"', '');

    // Hapus data uji
    const { error: delErr } = await sb.from('work_orders').delete().eq('id', testWo.id);
    if (delErr) add('warn', '⚠ Hapus WO uji gagal', delErr.message);
    else add('ok', '✓ Hapus WO uji', '');
  }

  // ============================================
  // KESIMPULAN
  // ============================================
  section('KESIMPULAN');
  if (fail === 0) {
    add('ok', '🎉 SEMUA TES LULUS!', `${pass} OK · ${warn} WARN · 0 GAGAL\n\nAplikasi siap dipakai.`);
  } else {
    add('bad', `⚠️ ${fail} GAGAL`, `Tes gagal:\n${failList.map(f => '• ' + f).join('\n')}`);
  }
})();
</script>
</body>
</html>
