<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audit Total KO-BRAS</title>
<link rel="stylesheet" href="style.css">
<style>
  body{padding:1.25rem; font-family:system-ui, sans-serif; max-width:720px; margin:0 auto;}
  h1{font-size:1.4rem; margin-bottom:.25rem}
  h2{font-size:1rem; margin:1.5rem 0 .5rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); border-bottom:1px solid var(--border); padding-bottom:.25rem}
  .item{padding:.65rem .85rem; margin:.35rem 0; border-radius:8px; border:1px solid var(--border); background:var(--surface); font-size:.85rem}
  .ok{border-left:3px solid var(--ok); background:#ecfdf5}
  .bad{border-left:3px solid var(--err); background:#fef2f2}
  .warn{border-left:3px solid var(--brand); background:#eff6ff}
  pre{font-size:.7rem; white-space:pre-wrap; word-break:break-all; margin:.35rem 0 0; color:var(--muted)}
  button{margin-top:1rem; padding:.75rem 1rem; border-radius:10px; border:1px solid var(--border); background:var(--brand); color:white; font-weight:700; width:100%; font-size:1rem; cursor:pointer}
  .summary{padding:1rem; background:var(--brand-light); border-radius:12px; margin-bottom:1rem; font-weight:700; display:none}
</style>
</head>
<body>
<h1>Audit Total KO-BRAS v3</h1>
<p class="muted small">Cek struktur database, RLS, RPC, Enum, dan alur kritis (SJ E2E).</p>
<div id="summary" class="summary"></div>
<div id="out"></div>
<button onclick="location.reload()">Ulangi Audit</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
const out = document.getElementById('out');
let pass = 0, fail = 0, warn = 0;
const failList = [];

function add(cls, title, detail) {
  const d = document.createElement('div');
  d.className = 'item ' + cls;
  d.innerHTML = '<b>' + title + '</b>' + (detail ? '<pre>' + String(detail).replace(/</g,'&lt;') + '</pre>' : '');
  out.appendChild(d);
  if (cls === 'ok') pass++;
  else if (cls === 'bad') { fail++; failList.push(title); }
  else if (cls === 'warn') warn++;
  
  const sum = document.getElementById('summary');
  sum.style.display = 'block';
  sum.innerHTML = `Hasil: <span style="color:var(--ok)">${pass} OK</span> · <span style="color:var(--err)">${fail} GAGAL</span> · <span style="color:var(--brand)">${warn} WARN</span>`;
}

function section(title) {
  const h = document.createElement('h2');
  h.textContent = title;
  out.appendChild(h);
}

(async () => {
  try {
    if (!window.KB || !window.KB.supabase) { add('bad', '✗ auth.js gagal load', ''); return; }
    const sb = window.KB.supabase;

    const { data: { session } } = await sb.auth.getSession();
    if (!session) { add('bad', '✗ Tidak ada session', 'Login dulu sebelum buka halaman ini.'); return; }

    const { data: org } = await sb.from('organizations').select('id, type, name').eq('created_by', session.user.id).maybeSingle();
    if (!org) { add('bad', '✗ Organisasi tidak ditemukan', ''); return; }

    add('ok', 'Setup', `Login: ${session.user.email}\nOrg: ${org.name} (${org.type})`);

    // ============================================
    section('1. TABEL & KOLOM');
    // ============================================
    
    const tables = [
      { name: 'profiles', cols: 'id, full_name' },
      { name: 'organizations', cols: 'id, name, type, city, province, status' },
      { name: 'organization_members', cols: 'org_id, profile_id, role' },
      { name: 'work_orders', cols: 'id, org_id, title, description, address, pic_name, pic_phone, total_price, status' },
      { name: 'work_order_items', cols: 'work_order_id, name' },
      { name: 'work_order_applications', cols: 'work_order_id, org_id, status, message' },
      { name: 'partner_surveys', cols: 'garment_org_id, konveksi_org_id, surveyed_by' },
      { name: 'organization_verifications', cols: 'id, org_id, status' },
      { name: 'organization_verification_events', cols: 'id, verification_id, event_type' },
      { name: 'platform_admins', cols: 'profile_id' }
    ];

    for (const t of tables) {
      const { error } = await sb.from(t.name).select(t.cols).limit(1);
      if (error) add('bad', `✗ Tabel/Kolom ${t.name}`, error.message);
      else add('ok', `✓ ${t.name}`, `${t.cols}`);
    }

    // ============================================
    section('2. FUNGSI DATABASE (RPC)');
    // ============================================
    
    const rpcs = [
      { name: 'get_orgs_public', args: { p_ids: [org.id] } },
      { name: 'accept_application_with_survey', args: { p_app_id: '00000000-0000-0000-0000-000000000000', p_survey_date: '2026-01-01', p_survey_notes: 'test' } },
      { name: 'is_konveksi_winner', args: { p_work_order_id: '00000000-0000-0000-0000-000000000000' } },
      { name: 'update_my_profile', args: {} }
    ];

    for (const r of rpcs) {
      const { error } = await sb.rpc(r.name, r.args);
      if (!error || (error.code !== '42883' && !error.message.includes('does not exist'))) {
        add('ok', `✓ RPC ${r.name}`, error ? `Exists (return: ${error.message})` : 'Exists (no error)');
      } else {
        add('bad', `✗ RPC ${r.name} TIDAK ADA`, error.message);
      }
    }

    // ============================================
    section('3. ENUM STATUS (5 VALUE)');
    // ============================================
    
    const statuses = ['open', 'matched', 'in_progress', 'completed', 'cancelled'];
    for (const st of statuses) {
      const { error } = await sb.from('work_orders').select('id').eq('status', st).limit(1);
      if (error) add('bad', `✗ Status "${st}" tidak valid`, error.message);
      else add('ok', `✓ Status "${st}" ada`, '');
    }

    // ============================================
    section('4. RLS / KEAMANAN');
    // ============================================
    
    const { error: pErr } = await sb.from('profiles').select('id, full_name').eq('id', session.user.id).maybeSingle();
    if (pErr) add('bad', '✗ Baca profile sendiri', pErr.message);
    else add('ok', '✓ Baca profile sendiri', '');

    const { error: phoneErr } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
    if (phoneErr) add('ok', '✓ Kolom phone terlindungi', 'SELECT * ditolak (bagus)');
    else add('warn', '⚠ SELECT * di profiles diizinin', 'Cek column grant');

    const { error: woErr } = await sb.from('work_orders').select('id').limit(1);
    if (woErr) add('bad', '✗ Baca work_orders', woErr.message);
    else add('ok', '✓ Baca work_orders', '');

    const { error: appErr } = await sb.from('work_order_applications').select('id').limit(1);
    if (appErr) add('bad', '✗ Baca work_order_applications', appErr.message);
    else add('ok', '✓ Baca work_order_applications', '');

    const { data: admins, error: adminErr } = await sb.from('platform_admins').select('*').limit(1);
    if (adminErr) add('ok', '✓ RLS di platform_admins aktif', 'Akses ditolak (bagus)');
    else if (admins && admins.length === 0) add('ok', '✓ RLS di platform_admins aktif', 'Table kosong (bagus)');
    else add('bad', '✗ RLS platform_admins BOCOR', 'Siapapun bisa baca admin!');

    // ============================================
    section('5. UJI INSERT/UPDATE/DELETE');
    // ============================================
    
    const { data: testWo, error: insErr } = await sb.from('work_orders').insert({
      org_id: org.id, created_by: session.user.id, title: `TEST_AUDIT_${Date.now()}`,
      target_quantity: 1, total_price: 1000, description: 'test', address: 'test',
      pic_name: 'test', pic_phone: '0812', status: 'open'
    }).select().single();

    if (insErr) add('bad', '✗ INSERT work_orders', insErr.message);
    else {
      add('ok', '✓ INSERT work_orders berhasil', `ID: ${testWo.id.slice(0, 8)}...`);
      const { error: upErr } = await sb.from('work_orders').update({ status: 'matched' }).eq('id', testWo.id);
      if (upErr) add('bad', '✗ Update status ke matched', upErr.message);
      else add('ok', '✓ Update status ke matched', '');
      await sb.from('work_orders').delete().eq('id', testWo.id);
      add('ok', '✓ Delete work_orders', '');
    }

    // ============================================
    section('6. SIMULASI ALUR SJ (E2E)');
    // ============================================
    
    let createdWoId = null;
    let createdAppId = null;

    if (org.type === 'garment') {
      add('ok', 'Mode: GARMENT', '');

      const { data: wo, error: woErr2 } = await sb.from('work_orders').insert({
        org_id: org.id, created_by: session.user.id,
        title: `AUDIT_SJ_${Date.now()}`,
        description: 'Test E2E', target_quantity: 1000, total_price: 4000000,
        deadline: '2026-12-31', address: 'Jl. Test', pic_name: 'Budi',
        pic_phone: '08123456789', status: 'open'
      }).select().single();

      if (woErr2) add('bad', '✗ Bikin SJ gagal', woErr2.message);
      else {
        createdWoId = wo.id;
        add('ok', '✓ SJ dibikin', `ID: ${wo.id.slice(0, 8)}... Status: ${wo.status}`);
        
        await sb.from('work_order_items').insert({ work_order_id: wo.id, name: 'Cotton Combed 30s' });
        add('ok', '✓ Item ditambah', 'Cotton Combed 30s');

        await sb.from('work_orders').update({ status: 'matched' }).eq('id', wo.id);
        add('ok', '✓ Update ke matched', '');

        await sb.from('work_orders').update({ status: 'in_progress' }).eq('id', wo.id);
        add('ok', '✓ Update ke in_progress', '');

        await sb.from('work_orders').update({ status: 'completed' }).eq('id', wo.id);
        add('ok', '✓ Update ke completed', 'Siklus lengkap ok');
      }
    } else if (org.type === 'konveksi') {
      add('ok', 'Mode: KONVEKSI', '');
      const { data: openWos } = await sb.from('work_orders').select('id, title').eq('status', 'open').limit(1);
      if (!openWos || openWos.length === 0) {
        add('warn', '⚠ Gak ada SJ open', 'Login Garment dulu, bikin SJ');
      } else {
        add('ok', '✓ Ketemu SJ open', openWos[0].title);
        createdWoId = openWos[0].id;

        const { data: existing } = await sb.from('work_order_applications')
          .select('id').eq('work_order_id', createdWoId).eq('org_id', org.id).maybeSingle();

        if (!existing) {
          const { data: app, error: appErr2 } = await sb.from('work_order_applications').insert({
            work_order_id: createdWoId, org_id: org.id, message: 'AUDIT test'
          }).select().single();
          if (appErr2) add('bad', '✗ Kirim lamaran', appErr2.message);
          else {
            createdAppId = app.id;
            add('ok', '✓ Lamaran terkirim', `Status: ${app.status}`);
          }
        } else {
          add('warn', '⚠ Sudah lamar SJ ini', 'Skip');
        }
      }
    }

    // ============================================
    section('7. UJI "TERBITKAN SURAT JALAN" (UI)');
    // ============================================
    
    if (org.type === 'garment') {
      const uiTitle = `UI_TEST_${Date.now()}`;
      const { data: newWo, error: uiErr } = await sb.from('work_orders').insert({
        org_id: org.id, created_by: session.user.id,
        title: uiTitle, description: 'Section 7 UI Test',
        target_quantity: 500, total_price: 2000000,
        deadline: '2026-12-31', address: 'Jl. UI Test',
        pic_name: 'UI Tester', pic_phone: '08111111111',
        negotiable_note: 'nego', status: 'open'
      }).select().single();

      if (uiErr) add('bad', '✗ Terbitkan SJ gagal', uiErr.message);
      else {
        add('ok', '✓ SJ diterbitkan', `ID: ${newWo.id.slice(0, 8)}... Title: ${newWo.title}`);

        const { data: garmentList, error: gListErr } = await sb.from('work_orders')
          .select('id, title, status').eq('org_id', org.id).order('created_at', { ascending: false });

        if (gListErr) add('bad', '✗ Query list gagal', gListErr.message);
        else {
          const found = (garmentList || []).find(w => w.id === newWo.id);
          if (found) add('ok', '✓ Muncul di list Garment', `Total ${garmentList.length} SJ. Posisi ${garmentList.findIndex(w => w.id === newWo.id) + 1}`);
          else add('bad', '✗ GAK muncul di list', `Query berhasil (${garmentList.length} SJ), tapi SJ baru gak ada`);
        }

        const { data: openList } = await sb.from('work_orders').select('id').eq('org_id', org.id).eq('status', 'open');
        if (openList && openList.find(w => w.id === newWo.id)) add('ok', '✓ Muncul di "SJ Aktif"', `Total open: ${openList.length}`);
        else add('bad', '✗ Gak muncul di "SJ Aktif"', `Total open: ${openList?.length || 0}`);

        await sb.from('work_order_items').insert({ work_order_id: newWo.id, name: 'Test Bahan' });
        add('ok', '✓ Item tersimpan', '');
      }

      // Cleanup Section 7
      if (newWo && newWo.id) {
        await sb.from('work_order_items').delete().eq('work_order_id', newWo.id);
        await sb.from('work_orders').delete().eq('id', newWo.id);
      }
    }

    // Cleanup Section 6
    if (createdAppId) await sb.from('work_order_applications').delete().eq('id', createdAppId);
    if (createdWoId && org.type === 'garment') {
      await sb.from('work_order_items').delete().eq('work_order_id', createdWoId);
      await sb.from('work_orders').delete().eq('id', createdWoId);
    }
    add('ok', '✓ Cleanup data test', '');

    // ============================================
    section('KESIMPULAN');
    if (fail === 0) {
      add('ok', '🎉 SEMUA TES LULUS!', `${pass} OK · ${warn} WARN · 0 GAGAL`);
    } else {
      add('bad', `⚠️ ${fail} GAGAL`, `Kegagalan:\n${failList.map(f => '• ' + f).join('\n')}`);
    }
  } catch (e) {
    add('bad', '💥 Fatal error di script audit', `${e.message}\n\n${e.stack || ''}`);
  }
})();
</script>
</body>
</html>
