<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cek KO-BRAS</title>
<link rel="stylesheet" href="style.css">
<style>
  body{padding:1.25rem;font-family:system-ui,sans-serif}
  h1{font-size:1.4rem}
  .item{padding:.75rem;margin:.5rem 0;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
  .ok{border-color:var(--ok)} .ok b{color:var(--ok)}
  .bad{border-color:var(--err)} .bad b{color:var(--err)}
  .warn{border-color:var(--brand)} .warn b{color:var(--brand)}
  pre{font-size:.72rem;white-space:pre-wrap;word-break:break-all;margin:.35rem 0 0;color:var(--muted)}
  button{margin-top:1rem;padding:.75rem 1rem;border-radius:10px;border:1px solid var(--border);background:var(--brand);color:#1a1000;font-weight:700;width:100%;font-size:1rem}
</style>
</head>
<body>
<h1>Diagnostik KO-BRAS v4</h1>
<div id="out"></div>
<button onclick="location.reload()">Ulangi Cek</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>

<script>
const out = document.getElementById('out');
function add(cls, title, detail) {
  const d = document.createElement('div');
  d.className = 'item ' + cls;
  d.innerHTML = '<b>' + title + '</b>' + (detail ? '<pre>' + String(detail).replace(/</g,'&lt;') + '</pre>' : '');
  out.appendChild(d);
}

(async () => {
  add('ok', '✓ Halaman dimuat', '');

  if (window.supabase && window.supabase.createClient) {
    add('ok', '✓ CDN Supabase', 'createClient tersedia');
  } else {
    add('bad', '✗ CDN Supabase gagal', 'window.supabase tidak ada');
    return;
  }

  if (window.KOBRAS_CONFIG && window.KOBRAS_CONFIG.SUPABASE_URL && window.KOBRAS_CONFIG.SUPABASE_ANON_KEY) {
    add('ok', '✓ config.js OK', 'URL: ' + window.KOBRAS_CONFIG.SUPABASE_URL);
  } else {
    add('bad', '✗ config.js kosong', '');
  }

  if (window.KB_ERROR) {
    add('bad', '✗ auth.js FATAL ERROR',
      'Message: ' + window.KB_ERROR.message + '\n\nStack:\n' + window.KB_ERROR.stack);
  } else if (window.KB && window.KB.supabase) {
    add('ok', '✓ window.KB siap', 'auth.js OK');
  } else {
    add('bad', '✗ window.KB kosong', 'Tidak ada KB_ERROR, tapi window.KB juga tidak ada. Aneh — mungkin cache browser. Reload dengan Ctrl+Shift+R.');
  }

  if (window.KB && window.KB.supabase) {
    try {
      const { error } = await window.KB.supabase.from('organizations').select('id').limit(1);
      if (error && !error.message.toLowerCase().includes('permission') && error.code !== '42501') {
        add('bad', '✗ Query error', error.message);
      } else {
        add('ok', '✓ Koneksi Supabase OK', error ? '(RLS deny normal: ' + error.code + ')' : 'query berhasil');
      }
    } catch (e) {
      add('bad', '✗ Query exception', String(e));
    }
  }
})();
</script>
</body>
</html>
