<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cek KO-BRAS</title>
<link rel="stylesheet" href="style.css">
<style>
  body{padding:1.25rem;font-family:system-ui,sans-serif}
  h1{font-size:1.4rem}
  .item{padding:.75rem;margin:.5rem 0;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
  .ok{border-color:var(--ok)} .ok b{color:var(--ok)}
  .bad{border-color:var(--err)} .bad b{color:var(--err)}
  .warn{border-color:var(--brand)} .warn b{color:var(--brand)}
  pre{font-size:.72rem;white-space:pre-wrap;word-break:break-all;margin:.35rem 0 0;color:var(--muted)}
  button{margin-top:1rem;padding:.75rem 1rem;border-radius:10px;border:1px solid var(--border);background:var(--brand);color:#1a1000;font-weight:700;width:100%;font-size:1rem}
</style>
</head>
<body>
<h1>Diagnostik KO-BRAS v2</h1>
<div id="out"></div>
<button onclick="location.reload()">Ulangi Cek</button>

<script>
// Tangkap error global sebelum script lain jalan
window.__kobrasErrors = [];
window.addEventListener('error', (e) => {
  window.__kobrasErrors.push({
    msg: e.message,
    file: e.filename,
    line: e.lineno,
    col: e.colno,
  });
});
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>

<script>
const out = document.getElementById('out');
function add(cls, title, detail) {
  const d = document.createElement('div');
  d.className = 'item ' + cls;
  d.innerHTML = '<b>' + title + '</b>' + (detail ? '<pre>' + String(detail).replace(/</g,'&lt;') + '</pre>' : '');
  out.appendChild(d);
}

(async () => {
  // 1. Cek window.supabase (dari CDN)
  if (typeof window.supabase === 'object' && window.supabase && window.supabase.createClient) {
    add('ok', '✓ Library Supabase (CDN) ke-load', 'window.supabase.createClient tersedia');
  } else {
    add('bad', '✗ Library Supabase CDN TIDAK ke-load',
      'Kemungkinan blokir jaringan / offline. Reload halaman.');
    return;
  }

  // 2. Cek config
  const cfg = window.KOBRAS_CONFIG || {};
  add(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY ? 'ok' : 'bad',
      cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY ? '✓ config.js OK' : '✗ config.js kosong',
      'URL: ' + (cfg.SUPABASE_URL || '-') + '\nKey: ' + (cfg.SUPABASE_ANON_KEY ? 'ada' : 'kosong'));

  // 3. Cek apakah auth.js ke-load (fetch mentah)
  try {
    const r = await fetch('auth.js', { cache: 'no-store' });
    if (!r.ok) {
      add('bad', '✗ auth.js TIDAK bisa di-fetch', 'HTTP ' + r.status + ' — file belum ke-push atau path salah.');
    } else {
      const text = await r.text();
      add('ok', '✓ auth.js bisa di-fetch',
        'ukuran: ' + text.length + ' byte\n' +
        'mengandung "window.KB": ' + text.includes('window.KB') + '\n' +
        'mengandung "createClient": ' + text.includes('createClient'));
    }
  } catch (e) {
    add('bad', '✗ fetch auth.js gagal', String(e));
  }

  // 4. Cek window.KB (hasil auth.js)
  if (window.KB && window.KB.supabase) {
    add('ok', '✓ window.KB ada & supabase tersedia', 'auth.js jalan sukses');
  } else {
    add('bad', '✗ window.KB TIDAK ada', 'auth.js gagal sebelum sempat assign window.KB');
  }

  // 5. Error global yang tertangkap
  if (window.__kobrasErrors.length === 0) {
    add('ok', '✓ Tidak ada error JS global', '');
  } else {
    add('bad', '✗ ' + window.__kobrasErrors.length + ' error JS tertangkap',
      window.__kobrasErrors.map(e =>
        `${e.file || '?'}:${e.line || '?'}\n  ${e.msg}`
      ).join('\n\n'));
  }

  // 6. Kalau window.KB ada, cek koneksi Supabase
  if (window.KB && window.KB.supabase) {
    try {
      const { error } = await window.KB.supabase.from('organizations').select('id').limit(1);
      if (error && !error.message.toLowerCase().includes('permission') && error.code !== '42501') {
        add('bad', '✗ Query Supabase error', error.message);
      } else {
        add('ok', '✓ Koneksi Supabase OK', error ? '(RLS deny normal: ' + error.code + ')' : 'query berhasil');
      }
    } catch (e) {
      add('bad', '✗ Query exception', String(e));
    }
  }
})();
</script>
</body>
</html>
