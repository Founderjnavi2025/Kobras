<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard Garment — KO-BRAS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="dashboard">
<header class="dash-header">
  <div class="container dash-header-inner">
    <a href="#" class="brand"><span class="brand-mark">◆</span><span class="brand-name">KO-BRAS</span><span class="role-tag">Garment</span></a>
    <div class="dash-user">
      <span id="userName" class="muted small">—</span>
      <button class="btn btn-outline btn-sm" id="logoutBtn">Keluar</button>
    </div>
  </div>
</header>

<main class="container dash-main">
  <div class="dash-hero">
    <div>
      <h1 id="orgName">Memuat...</h1>
      <p class="muted"><span id="orgType">Garment</span> · <span id="orgCity">—</span></p>
    </div>
    <div class="verif-box">
      <span class="muted small">Status</span>
      <span class="badge" id="verifBadge">Memuat...</span>
    </div>
  </div>

  <div class="dash-grid">
    <!-- KOLOM KIRI: FORM -->
    <div class="dash-col">
      <div class="card">
        <div class="card-head"><h2>Buat Surat Jalan Baru</h2></div>
        <form id="createWorkForm" class="stack-form">
          <label>Judul Pekerjaan<input name="title" placeholder="Cth: Kaos Polos Hitam" required /></label>
          <div style="display:flex; gap:1rem;">
            <label style="flex:1;">Target Qty (pcs)<input name="target_quantity" type="number" min="1" required /></label>
            <label style="flex:1;">Deadline<input name="deadline" type="date" /></label>
          </div>
          <label>Detail Bahan/Barang<input name="items" placeholder="Cth: Cotton Combed 30s" required /></label>
          <button type="submit" class="btn btn-primary btn-block">Terbitkan Surat Jalan</button>
        </form>
      </div>
    </div>

    <!-- KOLOM KANAN: LIST -->
    <div class="dash-col">
      <div class="card">
        <div class="card-head"><h2>Surat Jalan Aktif</h2></div>
        <div id="garmentWorkList" class="list-container">
          <div class="empty-state">Memuat data...</div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="dashboard.js?v=13"></script>
<script>
  KB.requireAuth("dashboard-garment");
  document.getElementById("logoutBtn").onclick = async () => { await KB.supabase.auth.signOut(); location.href = "index.html"; };
  window.addEventListener("load", () => initDashboardData("garment"));
</script>
</body>
</html>
