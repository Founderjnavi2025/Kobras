<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard Konveksi — KO-BRAS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="dashboard">
<header class="dash-header">
  <div class="container dash-header-inner">
    <a href="#" class="brand"><span class="brand-mark">◆</span><span class="brand-name">KO-BRAS</span><span class="role-tag role-k">Konveksi</span></a>
    <div class="dash-user">
      <span id="userName" class="muted small">—</span>
      <button class="btn btn-outline btn-sm" id="logoutBtn">Keluar</button>
    </div>
  </div>
</header>

<main class="container dash-main">
  <div class="dash-hero dash-hero-k">
    <div>
      <h1 id="orgName">Memuat...</h1>
      <p class="muted"><span id="orgType">Konveksi</span> · <span id="orgCity">—</span></p>
    </div>
    <div class="verif-box">
      <span class="muted small">Status</span>
      <span class="badge" id="verifBadge">Memuat...</span>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h2>Surat Jalan Masuk</h2><p class="muted small">Ambil pekerjaan jika kapasitas Anda mencukupi untuk seluruh pesanan.</p></div>
    <div id="konveksiWorkList" class="list-container">
      <div class="empty-state">Memuat data...</div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="dashboard.js"></script>
<script>
  KB.requireAuth("dashboard-konveksi");
  document.getElementById("logoutBtn").onclick = async () => { await KB.supabase.auth.signOut(); location.href = "index.html"; };
  window.addEventListener("load", () => initDashboardData("konveksi"));
</script>
</body>
</html>
